<div class="chrome">
  <div class="repo">
    <span class="repo-name" id="repoName"></span>
    <span class="repo-sub mono" id="headRef"></span>
  </div>

  <div class="control">
    <label for="branchSel">Branch</label>
    <select id="branchSel"></select>
  </div>

  <label class="switch"><input type="checkbox" id="showRemotes" checked> Show Remote Branches</label>
  <label class="switch"><input type="checkbox" id="onlyRefs"> Csak ref-es commitok</label>

  <div class="spacer"></div>
  <div class="stat" id="counter"></div>
  <button class="btn" id="themeBtn" type="button">Téma</button>
</div>

<div class="scroll">
  <div class="thead">
    <div class="thead-graph" role="img" title="Graph" aria-label="Graph">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
        <path d="M4 4v8" stroke="currentColor" stroke-width="1.25" fill="none"/>
        <path d="M4 7h4a3 3 0 0 1 3 3v1" stroke="currentColor" stroke-width="1.25" fill="none"/>
        <circle cx="4" cy="3" r="1.7" fill="currentColor"/>
        <circle cx="11" cy="12.6" r="1.7" fill="currentColor"/>
      </svg>
    </div><div>Description</div><div>Date</div><div>Author</div><div>Commit</div>
  </div>
  <div class="graph-wrap">
    <svg id="lanes" aria-hidden="true"></svg>
    <div class="rows" id="rows"></div>
  </div>
  <p class="foot" id="foot">Élő — kapcsolódás…</p>
</div>
