  </div>

  <div class="tools">
  <div class="menu">
    <button type="button" class="select ghost" id="searchBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Commitok keresése" data-tip="Keresés" data-kbd="⌘F"></button>
    <div class="menu-pop end search-pop" id="searchPop" role="dialog" aria-label="Keresés" hidden>
      <label class="menu-search">
        <input type="search" id="search" placeholder="Commitok keresése" aria-label="Commitok keresése: üzenet, szerző, hash, ág" autocomplete="off" spellcheck="false">
      </label>
      <button type="button" class="option setting" id="onlyRefs" role="menuitemcheckbox" data-keep aria-checked="false"><span class="name">Csak ref-es commitok</span><span class="track"></span></button>
    </div>
  </div>
  <button type="button" class="select ghost gear" id="sideBtn" aria-pressed="false" aria-label="Fájlok" data-tip="Fájlok"></button>
  </div>
</div>


<div class="pending" id="pending" hidden></div>

<div class="scroll">
  <div class="graph-wrap">
    <svg id="lanes" aria-hidden="true"></svg>
    <div class="rows" id="rows"></div>
  </div>
</div>

<div class="foot" id="foot">
  <span class="live" id="live"><span class="dot" id="liveDot" role="img" aria-label="Kapcsolódás"></span><span id="liveText">Kapcsolódás…</span><span class="ver" id="version"></span></span>
  <span class="mid"><span class="count" id="counter"></span><span class="fpath" id="footPath" hidden></span></span>
  <span class="links">
    <span class="gh" id="footLinks"></span>
    <span class="menu">
      <button type="button" class="mini" id="themeBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Téma">
        <svg class="ic" id="themeIcon" viewBox="0 0 16 16" aria-hidden="true"></svg>
      </button>
      <span class="menu-pop end up" id="themePop" role="listbox" aria-label="Téma" hidden></span>
    </span>
    <span class="menu">
      <button type="button" class="mini" id="settingsBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Beállítások" data-tip="Beállítások"></button>
      <span class="menu-pop end up settings" id="settingsPop" role="menu" aria-label="Beállítások" hidden></span>
    </span>
  </span>
</div>
