# git-cliff konfiguráció a /workflow:release-hez (git-cliff ≥ 2.14).
# Alap: `git cliff --init` (2.14.2); az eltérések kommentben.
# https://git-cliff.org/docs/configuration

[changelog]
header_marker = "<!-- git-cliff: end of header -->"
# A merge commitok kimaradnak: a tárgysoruk Conventional (a PR címe, ill. a `dev` mergéjéé),
# különben a mergelt commitok mellett külön sorként is megjelennének.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | filter(attribute="merge_commit", value=false) | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
# A sorrend számít: az első illeszkedő dönt. Elöl a kihagyottak — a memória, a worklog és a
# release-commit nem a User-nek szól.
commit_parsers = [
    { message = "^memory", skip = true },
    { message = "^docs\\(worklog\\)", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor|^simplify", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore|^ci|^build|^deploy", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
# Csak a `v<szám>` tag verzió — a `<név>--v1.0.0`-féle (pl. plugin-) tagek nem.
tag_pattern = "^v[0-9]"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

# A verzió a commit-típusokból jön, `v0.1.0`-tól. `0.x`-ben a breaking change is csak minor,
# `1.0` fölött major; a `feat` mindig minor.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
